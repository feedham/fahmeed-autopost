name: Daily Facebook good-morning posts

on:
  schedule:
    # GitHub often starts scheduled jobs hours late, so the job runs several times
    # a day and hands the next posts to Facebook's own scheduler, which publishes
    # them at exactly 09:00 Pakistan time. Extra runs do nothing (see state.json).
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would happen (true/false)"
        default: "true"
      day:
        description: "Post this day number (1-30) immediately - leave blank for normal scheduling"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Schedule / post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_DAY: ${{ github.event.inputs.day || '' }}
          POST_NOW: ${{ github.event.inputs.day != '' && 'true' || 'false' }}
        run: python post.py
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update post state [skip ci]" && git push)
